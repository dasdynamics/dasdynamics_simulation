# Часы: Gazebo -> ROS
- ros_topic_name: "/clock"
  gz_topic_name: "/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS

# Команды скорости: ROS -> Gazebo
- ros_topic_name: "/cmd_vel"
  gz_topic_name: "/cmd_vel"
  ros_type_name: "geometry_msgs/msg/Twist"
  gz_type_name: "gz.msgs.Twist"
  direction: ROS_TO_GZ

# Одометрия: Gazebo -> ROS
# Замените <world_name> и <robot_name> на свои (например: default и diff_drive)
- ros_topic_name: "/odom"
  gz_topic_name: "/world/<world_name>/model/<robot_name>/odometry"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "gz.msgs.Odometry"
  direction: GZ_TO_ROS

# Joint states: Gazebo -> ROS
# Замените <world_name> и <robot_name> на свои
- ros_topic_name: "/joint_states"
  gz_topic_name: "/world/<world_name>/model/<robot_name>/joint_state"
  ros_type_name: "sensor_msgs/msg/JointState"
  gz_type_name: "gz.msgs.Model"
  direction: GZ_TO_ROS